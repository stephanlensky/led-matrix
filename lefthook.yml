pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,md,yml,yaml,css,html}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js}"
      run: pnpm exec oxlint --type-aware {staged_files}
    - name: format firmware
      glob: "firmware/**/*.{cpp,h}"
      run: clang-format -i {staged_files}
      stage_fixed: true
