[platformio]
default_envs = matrixportal
extra_configs = config.ini

[config]
station_ssid =
station_password =
access_point_ssid = led-matrix
access_point_password = led-matrix
server_host =
bit_depth = 5

[env:matrixportal]
platform = espressif32 @ 8.0.0
board = adafruit_matrixportal_esp32s3
framework = arduino
lib_deps =
  adafruit/Adafruit Protomatter @ 1.7.1
  adafruit/Adafruit GFX Library @ 1.13.0
build_src_flags = -Wall -Wextra
build_flags =
  '-DSTATION_SSID="${config.station_ssid}"'
  '-DSTATION_PASSWORD="${config.station_password}"'
  '-DACCESS_POINT_SSID="${config.access_point_ssid}"'
  '-DACCESS_POINT_PASSWORD="${config.access_point_password}"'
  '-DSERVER_HOST="${config.server_host}"'
  -DBIT_DEPTH=${config.bit_depth}
monitor_speed = 115200
monitor_port = /dev/serial/by-id/usb-Adafruit_MatrixPortal_ESP32-S3_*

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++20 -Wall -Wextra
